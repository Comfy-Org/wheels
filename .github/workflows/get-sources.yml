name: Get Patched Sources
run-name: "Fetch sources: ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to fetch sources for"
        required: true
        type: choice
        options:
          - sageattention
          - flash_attn
          - sageattn3
          - cc_torch
          - torch_generic_nms

jobs:
  fetch-sources:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Fetch patched sources
        run: python scripts/fetch_patched_sources.py --package "${{ inputs.package }}" --output-dir patched-sources

      - name: Upload patched sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-sources-${{ inputs.package }}
          path: patched-sources/
